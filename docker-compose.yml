services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: assay_import
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "8765:8765"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DATABASE: assay_import
      GITHUB_REPO_URL: https://github.com/joel-duke/assay-guard
    depends_on:
      db:
        condition: service_healthy